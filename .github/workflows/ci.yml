name: CI

on:
  pull_request:
    branches: [beta, main]
  push:
    branches: [beta, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # No --fix in CI: a lint error must fail the build, not be silently rewritten.
      - run: pnpm exec eslint "{src,apps,libs,test}/**/*.ts"
      - run: pnpm test
      - run: pnpm build
